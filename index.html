    <script>
      // Fix for Chrome extensions attempting to intercept window.fetch
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If already defined or restricted, proceed
        }

        // Catch and isolate uncaught extension errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (event.message.indexOf('fetch') !== -1 || event.message.indexOf('requests.js') !== -1))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = String(event.reason || '');
          if (
            reasonStr.indexOf('fetch') !== -1 ||
            reasonStr.indexOf('chrome-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

  </body>
